name: CI

on:
  push:
    branches: [develop, preprod, main]
  pull_request:
    branches: [develop, preprod, main]

permissions:
  contents: read

jobs:
  quality-gates:
    name: Quality gates
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: starter
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d starter"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.0.0
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Check boundaries
        run: pnpm boundaries
      - name: Check cycles
        run: pnpm cycles
      - name: Test
        run: pnpm test
      - name: Build web and API
        run: pnpm build
      - name: Validate Expo configuration
        run: pnpm mobile:check
      - name: Build API image
        run: docker build --tag cross-platform-starter-api --file apps/api/Dockerfile .
      - name: Start API image
        run: >-
          docker run --detach --name cross-platform-starter-api
          --add-host host.docker.internal:host-gateway
          --publish 1337:1337
          --env DATABASE_URL=postgres://postgres:postgres@host.docker.internal:5432/starter
          --env APP_KEYS=ci-key-one,ci-key-two
          --env API_TOKEN_SALT=ci-api-token-salt
          --env ADMIN_JWT_SECRET=ci-admin-jwt-secret
          --env TRANSFER_TOKEN_SALT=ci-transfer-token-salt
          --env JWT_SECRET=ci-jwt-secret
          cross-platform-starter-api
      - name: Smoke test API image
        run: curl --fail --retry 12 --retry-connrefused http://localhost:1337/api/health
