openapi: 3.1.2
info:
  title: La Cabane du Merle API
  version: 1.0.0
  license:
    name: UNLICENSED
    identifier: LicenseRef-Proprietary
servers:
  - url: /v1
paths:
  /health:
    get:
      operationId: getHealth
      summary: Verify that the HTTP boundary is available.
      security: []
      responses:
        '200':
          description: API is available.
          headers:
            X-Correlation-Id:
              description: Identifier shared with this request's logs.
              required: true
              schema:
                type: string
                pattern: '^[A-Za-z0-9-]{1,128}$'
                minLength: 1
                maxLength: 128
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '500':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
components:
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, detail, correlationId]
      properties:
        type:
          type: string
          format: uri-reference
          pattern: '^https://la-cabane-du-merle\.invalid/problems/[1-5][0-9]{2}$'
          maxLength: 80
        title:
          type: string
          minLength: 1
          maxLength: 120
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          minLength: 1
          maxLength: 512
        correlationId:
          type: string
          pattern: '^[A-Za-z0-9-]{1,128}$'
          minLength: 1
          maxLength: 128
  responses:
    Problem:
      description: RFC 9457 problem response.
      headers:
        X-Correlation-Id:
          description: Identifier shared with this request's logs.
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9-]{1,128}$'
            minLength: 1
            maxLength: 128
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
