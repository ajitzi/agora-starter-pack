openapi: 3.1.2
info:
  title: La Cabane du Merle API
  version: 1.0.0
  license:
    name: UNLICENSED
    identifier: LicenseRef-Proprietary
servers:
  - url: /v1
paths:
  /auth/csrf:
    get:
      operationId: getCsrfToken
      summary: Obtain the CSRF token for an authenticated cookie mutation.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: CSRF token issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
  /auth/login:
    post:
      operationId: login
      summary: Authenticate with an email address and password.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Opaque session established.
          headers:
            Set-Cookie:
              required: true
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
        '401':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /auth/recovery:
    post:
      operationId: requestPasswordRecovery
      summary: Request a password recovery email without disclosing account status.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordRecoveryRequest'
      responses:
        '202':
          description: Generic recovery response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericRecoveryResult'
        '500':
          $ref: '#/components/responses/Problem'
  /auth/reset-password:
    post:
      operationId: resetPassword
      summary: Consume a one-time password recovery token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '204': { description: Password replaced and existing sessions revoked. }
        '400':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /auth/session:
    get:
      operationId: getCurrentSession
      summary: Revalidate the current session and active account.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Current authorized role and local destination.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
        '401':
          $ref: '#/components/responses/Problem'
  /auth/logout:
    post:
      operationId: logout
      summary: End the current authenticated session.
      security: [{ sessionCookie: [] }]
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        '204': { description: Session ended. }
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /admin/accounts:
    get:
      operationId: listAccounts
      summary: List the minimum administration details for accounts.
      security: [{ sessionCookie: [] }]
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Accounts, content: { application/json: { schema: { $ref: '#/components/schemas/AccountList' } } } }
        '401': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createAccount
      summary: Create an account and queue its approved password setup email.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateAccountRequest' } } }
      responses:
        '201': { description: Account created, content: { application/json: { schema: { $ref: '#/components/schemas/Account' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /admin/accounts/{id}:
    patch:
      operationId: updateAccount
      summary: Explicitly change account roles or activation state.
      security: [{ sessionCookie: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateAccountRequest' } } }
      responses:
        '200': { description: Updated account, content: { application/json: { schema: { $ref: '#/components/schemas/Account' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /admin/accounts/{id}/sessions/revoke:
    post:
      operationId: revokeAccountSessions
      summary: Revoke all sessions or one administrator-selected session position without exposing session identifiers.
      security: [{ sessionCookie: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RevokeSessionsRequest' } } }
      responses:
        '200': { description: Account with revised active session count, content: { application/json: { schema: { $ref: '#/components/schemas/Account' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /health:
    get:
      operationId: getHealth
      summary: Verify that the HTTP boundary is available.
      security: []
      responses:
        '200':
          description: API is available.
          headers:
            X-Correlation-Id:
              description: Identifier shared with this request's logs.
              required: true
              schema:
                type: string
                pattern: '^[A-Za-z0-9-]{1,128}$'
                minLength: 1
                maxLength: 128
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '500':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: lcm-session
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        password: { type: string, minLength: 1, maxLength: 1024 }
    LoginResult:
      type: object
      additionalProperties: false
      required: [role, destination]
      properties:
        role: { type: string, enum: [admin, amap] }
        destination: { type: string, enum: [/administration, /amap] }
    PasswordRecoveryRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 320 }
    GenericRecoveryResult:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message: { type: string, minLength: 1, maxLength: 160 }
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [token, password, confirmation]
      properties:
        token: { type: string, minLength: 1, maxLength: 256, writeOnly: true }
        password: { type: string, minLength: 12, maxLength: 128, writeOnly: true }
        confirmation: { type: string, minLength: 12, maxLength: 128, writeOnly: true }
    CsrfToken:
      type: object
      additionalProperties: false
      required: [csrfToken]
      properties:
        csrfToken: { type: string, minLength: 1 }
    Account:
      type: object
      additionalProperties: false
      required: [id, email, roles, active, version, lastActivityAt, activeSessions]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        roles: { type: array, minItems: 1, items: { type: string, enum: [admin, amap] } }
        active: { type: boolean }
        version: { type: integer, minimum: 1 }
        lastActivityAt: { type: [string, 'null'], format: date-time }
        activeSessions: { type: integer, minimum: 0 }
    AccountList:
      type: object
      additionalProperties: false
      required: [accounts, nextCursor]
      properties:
        accounts: { type: array, items: { $ref: '#/components/schemas/Account' } }
        nextCursor: { type: [string, 'null'], format: uuid }
    CreateAccountRequest:
      type: object
      additionalProperties: false
      required: [email, roles]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        roles: { type: array, minItems: 1, uniqueItems: true, items: { type: string, enum: [admin, amap] } }
    UpdateAccountRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        roles: { type: array, minItems: 1, uniqueItems: true, items: { type: string, enum: [admin, amap] } }
        active: { type: boolean }
    RevokeSessionsRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, expectedActiveSessions, scope]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        expectedActiveSessions: { type: integer, minimum: 1 }
        scope: { type: string, enum: [all, one] }
        sessionPosition: { type: integer, minimum: 1, description: Administrator-selected position in the active-session count; never a session identifier. }
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, detail, correlationId]
      properties:
        type:
          type: string
          format: uri-reference
          pattern: '^https://la-cabane-du-merle\.invalid/problems/[1-5][0-9]{2}$'
          maxLength: 80
        title:
          type: string
          minLength: 1
          maxLength: 120
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          minLength: 1
          maxLength: 512
        correlationId:
          type: string
          pattern: '^[A-Za-z0-9-]{1,128}$'
          minLength: 1
          maxLength: 128
  responses:
    Problem:
      description: RFC 9457 problem response.
      headers:
        X-Correlation-Id:
          description: Identifier shared with this request's logs.
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9-]{1,128}$'
            minLength: 1
            maxLength: 128
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string, minLength: 1 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
